name: Tests

on:
  push:
    paths: ['bot/**', '.github/workflows/**']
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bot
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: Type-check
        run: npx tsc --noEmit
      - name: Test plan (fake joiner + edge cases; Slack, Claude and GitHub faked)
        run: npx tsx --test test/*.test.ts
