name: Daily lifecycle run

# Three runs a day (IST). GitHub can start scheduled runs 5-20 minutes late.
#   09:00 IST  full run: DM nudges with Mark done, escalations, countdown in #reminders, summary in #people-ops-alerts
#   15:30 IST  catch-up: summary + escalations in #people-ops-alerts, countdowns not yet posted today (no repeat DMs)
#   22:00 IST  catch-up: same as 15:30
on:
  schedule:
    - cron: '30 3 * * *'        # 03:30 UTC = 09:00 IST
    - cron: '0 10 * * *'        # 10:00 UTC = 15:30 IST
    - cron: '30 16 * * *'       # 16:30 UTC = 22:00 IST
  workflow_dispatch:            # "Run workflow" button in the Actions tab
    inputs:
      mode:
        description: 'daily = full run, countdown = only the countdown reminders, preview = print only'
        type: choice
        options: [daily, countdown, preview]
        default: daily
      today:
        description: 'Optional: pretend today is YYYY-MM-DD (demos and tests)'
        required: false
        default: ''

concurrency: lifecycle-run

# The bot runs on Vercel (it reads the Google Sheet there); GitHub only provides the clock.
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Run the bot
        run: |
          case "$SCHEDULE" in
            "0 10 * * *")  SLOT=afternoon ;;
            "30 16 * * *") SLOT=evening ;;
            *)             SLOT=morning ;;
          esac
          curl -fsS --max-time 90 "https://people-lifecycle-kit-bot.vercel.app/api/cron?job=${MODE}&slot=${SLOT}&today=${TODAY}&force=${FORCE}&key=${KEY}"
        env:
          SCHEDULE: ${{ github.event.schedule }}
          MODE: ${{ inputs.mode || 'daily' }}
          TODAY: ${{ inputs.today }}
          FORCE: ${{ github.event_name == 'workflow_dispatch' }}
          KEY: ${{ secrets.CRON_SECRET }}
