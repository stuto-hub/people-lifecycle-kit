name: Daily lifecycle run

on:
  schedule:
    - cron: '30 3 * * *'        # 03:30 UTC = 09:00 IST
    - cron: '30 15 * * *'       # 15:30 UTC = 21:00 IST backup (skipped if the morning run already went out)
  workflow_dispatch:            # "Run workflow" button in the Actions tab
    inputs:
      mode:
        description: 'daily = nudges + countdown + digest, countdown = only the 5/3/0-day reminders, preview = print only'
        type: choice
        options: [daily, countdown, preview]
        default: daily
      today:
        description: 'Optional: pretend today is YYYY-MM-DD (demos and tests)'
        required: false
        default: ''

concurrency: lifecycle-run

# The bot runs on Vercel (it reads the Google Sheet there); GitHub only provides the clock.
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Run the bot
        run: |
          curl -fsS --max-time 90 "https://people-lifecycle-kit-bot.vercel.app/api/cron?job=${MODE}&today=${TODAY}&force=${FORCE}&key=${KEY}"
        env:
          MODE: ${{ inputs.mode || 'daily' }}
          TODAY: ${{ inputs.today }}
          FORCE: ${{ github.event_name == 'workflow_dispatch' }}
          KEY: ${{ secrets.CRON_SECRET }}
