name: Daily lifecycle run

on:
  schedule:
    - cron: '30 3 * * *'        # 03:30 UTC = 09:00 IST
    - cron: '30 15 * * *'       # 15:30 UTC = 21:00 IST backup, in case GitHub skips the morning run
  workflow_dispatch:            # "Run workflow" button in the Actions tab
    inputs:
      mode:
        description: 'daily = nudges + digest, preview = print only (sends nothing)'
        type: choice
        options: [daily, preview]
        default: daily
      today:
        description: 'Optional: pretend today is YYYY-MM-DD (demos and tests)'
        required: false
        default: ''

concurrency: lifecycle-run

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: bot
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: Run the bot
        run: npx tsx scripts/daily.ts "$MODE"
        env:
          MODE: ${{ inputs.mode || 'daily' }}
          TODAY: ${{ inputs.today }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
