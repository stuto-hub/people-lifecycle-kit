name: Clean up bot messages

on:
  workflow_dispatch:
    inputs:
      links:
        description: 'Slack links of the bot messages to delete (Copy link in Slack), separated by spaces'
        required: true

jobs:
  cleanup:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bot
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/cleanup.js
        env:
          LINKS: ${{ inputs.links }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
